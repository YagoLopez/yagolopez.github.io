<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link href="css/bootstrap-3.0.3.min.css" rel="stylesheet">
  <link href="css/smarton.css" rel="stylesheet">
  <title>Contact Form</title>
</head>

<body>

  <form class="form-horizontal"
    action="https://docs.google.com/forms/d/1jgrR3nIwlpnM1xD-KoPa_5c9ocr9-oltk-dKSwtLDkM/formResponse" method="POST"
    id="ss-form" target="_self" onsubmit="" role="form" style="margin-bottom:25px;">

    <div class="form-group">
      <div class="col-lg-12">
        <label for="entry_1860233402">Sender *</label>
        <div>Name of the person or organization sending the message</div>
        <div>
          <input type="text" name="entry.1860233402" value="" class="form-control" id="entry_1860233402" dir="auto"
            aria-label="Sender Name of the person or organization sending the message " aria-required="true" required
            title="Sender" />
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="col-lg-12">
        <label for="entry_1525432043">Email address *</label>
        <div>Address where the response will be sent</div>
        <div>
          <input type="email" name="entry.1525432043" value="" class="ss-q-short form-control" id="entry_1525432043"
            dir="auto" aria-label="Email address" aria-required="true" required title="Email" />
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="col-lg-12">
        <label for="entry_1456239937">Message *</label>
        <div>Text to send</div>
        <div>
          <textarea name="entry.1456239937" rows="3" cols="0" class="ss-q-long form-control" id="entry_1456239937"
            dir="auto" aria-label="Message content " aria-required="true" required title="Message content"></textarea>
        </div>
      </div>
    </div>

    <input type="submit" name="submit" value="Send Message" id="ss-submit" class="btn btn-primary">
  </form>

</body>

</html>
